<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Zakot Tizimi</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #17212b);
      --text-color: var(--tg-theme-text-color, #f5f5f5);
      --hint-color: var(--tg-theme-hint-color, #708499);
      --accent-color: var(--tg-theme-button-color, #5288c1);
      --card-bg: var(--tg-theme-secondary-bg-color, #232e3c);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); overflow-x: hidden; }

    /* TELEGRAM PAPKALARI USLUBIDAGI YUQORI MENYU */
    .tab-bar {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      background: rgba(23, 33, 43, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: sticky;
      top: 0;
      z-index: 100;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
    }
    .tab-bar::-webkit-scrollbar { display: none; }

    .tab-btn {
      flex-shrink: 0;
      padding: 7px 15px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.25s ease;
      touch-action: pan-x;
    }
    .tab-btn.active {
      background: var(--accent-color);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 2px 8px rgba(82, 136, 193, 0.35);
    }
    .badge {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 600;
    }

    /* BO'LIMLAR */
    .tab-content { display: none; padding: 14px; }
    .tab-content.active { display: block; }

    /* FORMA ELEMENTLARI */
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 13px; color: var(--hint-color); margin-bottom: 5px; }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: var(--card-bg);
      color: var(--text-color);
      font-size: 14px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent-color); }

    .submit-btn {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      background: var(--accent-color);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      margin-top: 10px;
    }

    /* KARTALAR */
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .card-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .card-row { font-size: 13px; color: var(--hint-color); margin-bottom: 3px; }
    .status-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      margin-top: 6px;
      font-weight: 500;
    }
    .status-Tasdiqlangan { background: rgba(76, 175, 80, 0.2); color: #81c784; }
    .status-Rad-etilgan { background: rgba(244, 67, 54, 0.2); color: #e57373; }
    .status-Berib-yuborilgan { background: rgba(255, 152, 0, 0.2); color: #ffb74d; }
    .status-Yetqazilgan { background: rgba(33, 150, 243, 0.2); color: #64b5f6; }
    .status-Yangi { background: rgba(158, 158, 158, 0.2); color: #e0e0e0; }

    .empty-state { text-align: center; color: var(--hint-color); padding: 40px 10px; font-size: 14px; }
  </style>
</head>
<body>

  <!-- YUQORI MENYU -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="openTab('tab-add', this)">➕ Ariza qo'shish</button>
    <button class="tab-btn" onclick="openTab('tab-my', this)">📋 Mening arizalarim <span class="badge" id="b-all">0</span></button>
    <button class="tab-btn" onclick="openTab('tab-approved', this)">🟢 Tasdiqlangan <span class="badge" id="b-approved">0</span></button>
    <button class="tab-btn" onclick="openTab('tab-rejected', this)">🔴 Rad etilgan <span class="badge" id="b-rejected">0</span></button>
    <button class="tab-btn" onclick="openTab('tab-dispatched', this)">🚚 Berib yuborilgan <span class="badge" id="b-dispatched">0</span></button>
    <button class="tab-btn" onclick="openTab('tab-delivered', this)">✅ Yetqazilgan <span class="badge" id="b-delivered">0</span></button>
  </div>

  <!-- 1. ARIZA QO'SHISH -->
  <div id="tab-add" class="tab-content active">
    <form id="zakotForm" onsubmit="submitForm(event)">
      <div class="form-group">
        <label>Zakot oluvchi F.I.O</label>
        <input type="text" id="recipientFio" required placeholder="To'liq ism-sharif">
      </div>
      <div class="form-group">
        <label>Telefon raqami</label>
        <input type="tel" id="recipientPhone" required placeholder="+998901234567">
      </div>
      <div class="form-group">
        <label>Tavsiya etuvchi manba</label>
        <input type="text" id="manba" placeholder="Mahalla oqsoqoli, qo'shni...">
      </div>
      <div class="form-group">
        <label>Sababi (Nima uchun tanlandi?)</label>
        <textarea id="reason" rows="2" placeholder="Nega aynan ushbu inson tanlandi?"></textarea>
      </div>
      <div class="form-group">
        <label>Belgilangan miqdor</label>
        <select id="amount">
          <option value="1 mln">1 000 000 so'm</option>
          <option value="2 mln">2 000 000 so'm</option>
          <option value="3 mln">3 000 000 so'm</option>
          <option value="4 mln">4 000 000 so'm</option>
          <option value="5 mln">5 000 000 so'm</option>
          <option value="Boshqa">Boshqa</option>
        </select>
      </div>
      <div class="form-group">
        <label>Manzili</label>
        <input type="text" id="locDisplay" placeholder="Manzilni yozing yoki lokatsiya oling">
        <button type="button" class="submit-btn" style="background:#2b5278; margin-top:6px;" onclick="getLocation()">📍 Lokatsiyani olish</button>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">Arizani yuborish</button>
    </form>
  </div>

  <!-- RO'YXATLAR -->
  <div id="tab-my" class="tab-content"><div id="list-all"></div></div>
  <div id="tab-approved" class="tab-content"><div id="list-approved"></div></div>
  <div id="tab-rejected" class="tab-content"><div id="list-rejected"></div></div>
  <div id="tab-dispatched" class="tab-content"><div id="list-dispatched"></div></div>
  <div id="tab-delivered" class="tab-content"><div id="list-delivered"></div></div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    // SIZNING APPS SCRIPT WEB APP URL MANZILINGIZ:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxzz_-WtiwIcIt6giXx-y8ekX05DAJ4um8sV9LYHz82LIOnit-F_i3YqZxoWnAdB56d/exec";

    const user = tg?.initDataUnsafe?.user || {};
    const chatId = user.id ? String(user.id) : "test_user";
    const userName = ((user.first_name || "") + " " + (user.last_name || "")).trim() || "Foydalanuvchi";

    function openTab(tabId, el) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      document.getElementById(tabId).classList.add('active');
      el.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }

    function getLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          document.getElementById('locDisplay').value = "https://maps.google.com/?q=" + lat + "," + lng;
        }, () => alert("Lokatsiya ruxsati berilmadi"));
      }
    }

    // ARIZANI GOOGLE SHEETSGA YUBORISH (POST)
    function submitForm(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.innerText = "Yuborilmoqda...";
      btn.disabled = true;

      const payload = {
        action: "ADD_RECORD_FROM_APP",
        chatId: chatId,
        senderFio: userName,
        recipientFio: document.getElementById('recipientFio').value,
        recipientPhone: document.getElementById('recipientPhone').value,
        manba: document.getElementById('manba').value,
        reason: document.getElementById('reason').value,
        amount: document.getElementById('amount').value,
        address: document.getElementById('locDisplay').value
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        btn.innerText = "Arizani yuborish";
        btn.disabled = false;
        document.getElementById('zakotForm').reset();
        document.getElementById('locDisplay').value = "";
        loadUserData();

        // Telegramning o'zini toza popup oynasi (domen nomi chiqmaydi):
        if (tg && tg.showAlert) {
          tg.showAlert("✅ Ariza muvaffaqiyatli yuborildi!");
        } else {
          alert("✅ Ariza muvaffaqiyatli yuborildi!");
        }
      })
      .catch((err) => {
        btn.innerText = "Arizani yuborish";
        btn.disabled = false;
        if (tg && tg.showAlert) {
          tg.showAlert("Xatolik yuz berdi: " + err);
        } else {
          alert("Xatolik yuz berdi: " + err);
        }
      });
    }

    // ARIZALARNI O'QIB OLISH (GET)
    function loadUserData() {
      fetch(SCRIPT_URL + "?action=GET_RECORDS&chatId=" + encodeURIComponent(chatId))
        .then(res => res.json())
        .then(records => {
          let counts = { all: 0, approved: 0, rejected: 0, dispatched: 0, delivered: 0 };
          let htmls = { all: "", approved: "", rejected: "", dispatched: "", delivered: "" };

          records.forEach(r => {
            counts.all++;
            const cardHtml = `
              <div class="card">
                <div class="card-title">${r.fio}</div>
                <div class="card-row">📞 Tel: ${r.phone}</div>
                <div class="card-row">💰 Miqdor: ${r.amount}</div>
                <div class="card-row">📌 Manba: ${r.manba}</div>
                ${r.reason ? `<div class="card-row">📝 Sababi: ${r.reason}</div>` : ''}
                <div class="card-row">📍 Manzili: ${r.address.startsWith('http') ? `<a href="${r.address}" target="_blank" style="color:var(--accent-color)">Xaritada ochish</a>` : r.address}</div>
                <div class="card-row">🗓 Sana: ${r.date}</div>
                <span class="status-badge status-${r.status.replace(/ /g, '-')}">${r.status}</span>
              </div>
            `;
            htmls.all += cardHtml;

            if (r.status === "Tasdiqlangan") { counts.approved++; htmls.approved += cardHtml; }
            else if (r.status === "Rad etilgan") { counts.rejected++; htmls.rejected += cardHtml; }
            else if (r.status === "Berib yuborilgan") { counts.dispatched++; htmls.dispatched += cardHtml; }
            else if (r.status === "Yetqazilgan") { counts.delivered++; htmls.delivered += cardHtml; }
          });

          document.getElementById('b-all').innerText = counts.all;
          document.getElementById('b-approved').innerText = counts.approved;
          document.getElementById('b-rejected').innerText = counts.rejected;
          document.getElementById('b-dispatched').innerText = counts.dispatched;
          document.getElementById('b-delivered').innerText = counts.delivered;

          document.getElementById('list-all').innerHTML = htmls.all || '<div class="empty-state">Hozircha arizalar yo\'q</div>';
          document.getElementById('list-approved').innerHTML = htmls.approved || '<div class="empty-state">Tasdiqlangan arizalar mavjud emas</div>';
          document.getElementById('list-rejected').innerHTML = htmls.rejected || '<div class="empty-state">Rad etilgan arizalar mavjud emas</div>';
          document.getElementById('list-dispatched').innerHTML = htmls.dispatched || '<div class="empty-state">Berib yuborilgan arizalar mavjud emas</div>';
          document.getElementById('list-delivered').innerHTML = htmls.delivered || '<div class="empty-state">Yetqazilgan arizalar mavjud emas</div>';
        })
        .catch(() => {});
    }

    loadUserData();
  </script>
</body>
</html>
